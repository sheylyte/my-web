    <!-- =========================================  
     TOP PROFILE AREA  
========================================= -->  

<header class="profile-header">  <div class="profile-background"></div>  

<div class="profile-area">  


    <!-- PROFILE AVATAR -->  

    <div class="profile-avatar" id="profileAvatarContainer">

    <span id="profileAvatar">0</span>

    <input
        type="file"
        id="profilePictureInput"
        accept="image/*"
        hidden
    >

</div>  


    <!-- USER INFORMATION -->  

    <div class="profile-information">  

        <div class="profile-name">  

            <span  
                class="username"  
                id="username"  
            >  
                Loading...  
            </span>  

            <span  
                class="country-flag"  
                id="countryFlag"  
            >  
                🌍  
            </span>  

        </div>  


        <div class="profile-id">  

            <span id="profileId">  
                ID: Loading...  
            </span>  

            <button  
                class="copy-id"  
                id="copyId"  
                title="Copy ID"  
                type="button"  
            >  

                <svg viewBox="0 0 24 24">  

                    <rect  
                        x="8"  
                        y="8"  
                        width="11"  
                        height="11"  
                        rx="2"  
                    ></rect>  

                    <path  
                        d="M16 8V6  
                           a2 2 0 0 0-2-2H6  
                           a2 2 0 0 0-2 2v8  
                           a2 2 0 0 0 2 2h2"  
                    ></path>  

                </svg>  

            </button>  

        </div>  

    </div>  


    <!-- PROFILE ARROW -->  

    <button  
        class="profile-arrow"  
        id="profileArrow"  
        type="button"  
    >  

        <svg viewBox="0 0 24 24">  

            <path d="M9 5l7 7-7 7"></path>  

        </svg>  

    </button>  

</div>  


<!-- =====================================  
     FOLLOWING / FANS / FRIENDS  
====================================== -->  

<div class="profile-stats">  

    <div class="stat">  

        <strong>0</strong>  

        <span>  
            Following  
        </span>  

    </div>  


    <div class="stat">  

        <strong>0</strong>  

        <span>  
            Fans  
        </span>  

    </div>  


    <div class="stat">  

        <strong>0</strong>  

        <span>  
            Friends  
        </span>  

    </div>  

</div>

</header>  <!-- =========================================

        id="coinsCard"  
        type="button"  
    >

            <span class="wallet-title">  
                Coins  
            </span>  

            <span class="wallet-value">  

                <span class="coin-small">  
                    🪙  
                </span>  

                0  

                <span class="wallet-arrow">  
                    ›  
                </span>  

            </span>  

        </div>  


        <div class="wallet-symbol coin-symbol">  
            ★  
        </div>  

    </button>  



    <!-- POINTS -->  

    <button  
        class="wallet-card points-card"  
        id="pointsCard"  
        type="button"  
    >

            <span class="wallet-title">  
                Points  
            </span>  

            <span class="wallet-value">  

                <span class="point-small">  
                    P  
                </span>  

                0  

                <span class="wallet-arrow">  
                    ›  
                </span>  

            </span>  

        </div>  


        <div class="wallet-symbol points-symbol">  
            P  
        </div>  

    </button>  

</section>
